[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-master"
version = "1.12.0"
description = "Cross-platform multi-provider LLM task router and AI coding agent triage console."
readme = "README.md"
authors = [
    { name = "dev-bricks" }
]
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
keywords = [
    "agent-orchestration",
    "ai-agents",
    "automation",
    "claude",
    "claude-code",
    "cli",
    "cloud-sync",
    "codex",
    "codex-cli",
    "cross-platform",
    "developer-tools",
    "gemini-cli",
    "llm",
    "multi-agent",
    "multi-system",
    "routing",
    "task-routing",
    "ticket-system",
    "triage",
    "workflow"
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
routing-v2 = ["clutch-router>=0.5,<0.6"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
    "build>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/ticket-master"
Documentation = "https://github.com/ellmos-ai/ticket-master#readme"
Repository = "https://github.com/ellmos-ai/ticket-master.git"
"Bug Tracker" = "https://github.com/ellmos-ai/ticket-master/issues"
Notice = "https://github.com/ellmos-ai/ticket-master/blob/main/NOTICE"
"Third-Party Licenses" = "https://github.com/ellmos-ai/ticket-master/blob/main/THIRD_PARTY_LICENSES.md"
"Marketing Log" = "https://github.com/ellmos-ai/ticket-master/blob/main/MARKETING-LOG.txt"
"LLM Ready" = "https://github.com/ellmos-ai/ticket-master/blob/main/llms.txt"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -v --basetemp=.pytest_temp"
pythonpath = "."
testpaths = ["tests"]
norecursedirs = [".git", ".pytest_cache", ".pytest_temp", "__pycache__", "build", "dist", "tickets"]

[tool.setuptools.packages.find]
include = ["lib*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
