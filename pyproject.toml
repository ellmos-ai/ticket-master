[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-master"
version = "1.10.0"
description = "Cross-platform multi-provider LLM task router and AI coding agent triage console."
readme = "README.md"
authors = [
    { name = "dev-bricks" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
keywords = [
    "ticket-router",
    "ai-agent",
    "llm",
    "claude",
    "codex",
    "gemini",
    "triage-console",
    "workflow",
    "local-first"
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/ellmos-ai/ticket-master"
Repository = "https://github.com/ellmos-ai/ticket-master.git"
"Bug Tracker" = "https://github.com/ellmos-ai/ticket-master/issues"

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
