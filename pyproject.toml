[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-master"
version = "1.11.2"
description = "Cross-platform multi-provider LLM task router and AI coding agent triage console."
readme = "README.md"
authors = [
    { name = "dev-bricks" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
keywords = [
    "ticket-router",
    "ai-agent",
    "llm",
    "claude",
    "codex",
    "gemini",
    "triage-console",
    "workflow",
    "local-first"
]
requires-python = ">=3.10"

[project.optional-dependencies]
routing-v2 = ["clutch-router>=0.5,<0.6"]

[project.urls]
Homepage = "https://github.com/ellmos-ai/ticket-master"
Documentation = "https://github.com/ellmos-ai/ticket-master#readme"
Repository = "https://github.com/ellmos-ai/ticket-master.git"
"Bug Tracker" = "https://github.com/ellmos-ai/ticket-master/issues"

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["lib*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
